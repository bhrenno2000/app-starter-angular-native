name: Check
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run export
      - name: Verify local instructions are not tracked
        run: |
          tracked=$(git ls-files '.claude/*' '.codex/*' '.agents/*' 'AGENTS.md' 'CLAUDE.md' 'PRODUCT.md' 'DESIGN.md')
          test -z "$tracked"
