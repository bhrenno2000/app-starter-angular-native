<view class="min-h-14 flex-row items-center gap-2 border-b border-border bg-background px-2 py-1">
  <pressable
    class="h-12 w-12 items-center justify-center"
    accessibilityRole="button"
    accessibilityLabel="Go back"
    [accessibilityState]="{ disabled: !canGoBack() }"
    [disabled]="!canGoBack()"
    [style.opacity]="canGoBack() ? 1 : 0.35"
    (press)="back.emit()"
  >
    <app-icon name="lucideChevronLeft" [size]="24" class="text-foreground" />
  </pressable>
  <text accessibilityRole="header" class="flex-1 font-semibold text-lg text-foreground">
    {{ title() }}
  </text>
</view>
