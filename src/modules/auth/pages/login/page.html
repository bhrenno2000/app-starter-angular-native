<app-form-screen-layout>
  <app-typography variant="title">Welcome back</app-typography>
  <app-form>
    <app-input
      label="Email"
      placeholder="email@example.com"
      keyboardType="email-address"
      [formField]="auth.loginForm.email"
    />
    <app-input
      label="Password"
      testId="login-password"
      placeholder="••••••••"
      [password]="true"
      [formField]="auth.loginForm.password"
    />
  </app-form>
  @if (auth.error()) {
    <text accessibilityRole="alert" class="text-sm text-danger">{{ auth.error() }}</text>
  }
  <app-form footer>
    <app-button
      label="Sign in"
      [loading]="auth.loginForm().submitting()"
      (pressed)="auth.login()"
    />
  </app-form>
</app-form-screen-layout>
