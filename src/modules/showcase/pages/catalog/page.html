<safe-area-view class="flex-1 bg-background">
  <view class="px-4 pt-4 pb-2">
    <app-button label="Back to home" variant="outline" (pressed)="showcase.back()" />
    @if (showcase.error()) {
      <text accessibilityRole="alert" class="mt-2 text-sm text-danger">{{ showcase.error() }}</text>
    }
  </view>
  <scroll-view class="flex-1">
    <view class="gap-6 px-4 pt-4 pb-6">
      <view class="gap-2">
        <app-typography variant="title">Native showcase</app-typography>
        <app-typography variant="muted">
          Explore real device capabilities powered by Angular.
        </app-typography>
      </view>
      @for (category of showcase.categories; track category.id) {
        <app-card>
          <view class="gap-3">
            <app-typography variant="heading">{{ category.title }}</app-typography>
            <app-typography variant="muted">{{ category.description }}</app-typography>
            <app-button
              [label]="'Explore ' + category.title"
              (pressed)="showcase.open(category.id)"
            />
          </view>
        </app-card>
      }
    </view>
  </scroll-view>
</safe-area-view>
