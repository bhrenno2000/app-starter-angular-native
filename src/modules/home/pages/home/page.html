<safe-area-view class="flex-1 bg-background">
  <scroll-view class="flex-1">
    <view class="gap-6 px-4 pt-4 pb-6">
      <view class="gap-1">
        <app-typography variant="muted">Hello,</app-typography>
        <app-typography variant="heading">{{ home.user()?.name ?? 'Guest' }}</app-typography>
        <app-typography variant="muted">{{ home.user()?.email ?? '' }}</app-typography>
      </view>
      <app-card>
        <text class="font-semibold text-base text-foreground">Theme</text>
        <view class="flex-row gap-2">
          @for (option of home.options; track option.mode) {
            <view class="flex-1">
              <app-button
                [label]="option.label"
                [variant]="home.themeMode() === option.mode ? 'solid' : 'outline'"
                (pressed)="home.setTheme(option.mode)"
              />
            </view>
          }
        </view>
      </app-card>
      @if (home.error()) {
        <text accessibilityRole="alert" class="text-sm text-danger">{{ home.error() }}</text>
      }
      <app-button label="Open native showcase" (pressed)="home.openShowcase()" />
      <app-button
        label="Sign out"
        icon="lucideLogOut"
        variant="outline"
        [danger]="true"
        [loading]="home.leaving()"
        (pressed)="home.logout()"
      />
    </view>
  </scroll-view>
</safe-area-view>
